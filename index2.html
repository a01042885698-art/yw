<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고속도로 휴게소 & 주유소 지도</title>
  
  <!-- 카카오맵 API 스크립트 (autoload=false 옵션을 추가하여 로딩 순서 보장) -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=f6a18520d069229015807e8670e8c92a&libraries=services&autoload=false"></script>

  <style>
    /* 전체 레이아웃 리셋 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      color: #333;
    }

    /* 왼쪽 사이드바 스타일링 */
    #sidebar {
      width: 360px;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e2e8f0;
      z-index: 10;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
    }

    .sidebar-header {
      padding: 20px;
      background-color: #1e293b;
      color: #ffffff;
    }

    .sidebar-header h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .sidebar-header p {
      font-size: 12px;
      color: #94a3b8;
    }

    /* 탭 버튼 스타일 */
    .tab-container {
      display: flex;
      background-color: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
    }

    .tab-button {
      flex: 1;
      padding: 14px 10px;
      border: none;
      background: none;
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-button.active {
      color: #2563eb;
      background-color: #ffffff;
      border-bottom: 3px solid #2563eb;
    }

    /* 장소 리스트 영역 */
    #places-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 12px;
    }

    .place-item {
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #f1f5f9;
      background-color: #ffffff;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .place-item:hover {
      background-color: #f8fafc;
      transform: translateY(-2px);
    }

    .place-name {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .place-address {
      font-size: 13px;
      color: #64748b;
      line-height: 1.4;
    }

    .place-phone {
      font-size: 12px;
      color: #16a34a;
      margin-top: 4px;
    }

    .no-result {
      padding: 30px;
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
    }

    /* 지도 영역 */
    #map-container {
      flex: 1;
      position: relative;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 지도 상단 컨트롤 버튼 (교통정보, 로드뷰) */
    .map-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 5;
      display: flex;
      gap: 8px;
    }

    .control-button {
      padding: 10px 14px;
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
    }

    .control-button.active {
